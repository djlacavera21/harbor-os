schema: harbor-flavor/v1
id: my-harbor-flavor
name: My Harbor Flavor
version: 0.1.0
license: MIT
author:
  name: Your Name
  url: https://github.com/yourname
summary: Short one-line description of this flavor.
description: |
  Describe what this overlay changes. Keep the base honest.
  Community flavors must not claim official xAI or Grok App status.
tags:
  - community
base:
  distro: linuxmint
  release: "22.3"
  desktop: cinnamon
  min_ram_mb: 4096
  arch:
    - x86_64
identity:
  os_name: HarborOS
  codename: Custom
  pretty_name: Harbor OS Custom
  hostname_prefix: harbor
alignment:
  principles:
    - Sovereignty first
    - Visual clarity over opacity
  operator_role: Operator
  agent_role: Advisor
  offline_first: true
  telemetry: none
visualizer:
  id: zen-garden
  port: 8080
  theme: raked-sand
  metaphor: System state as a garden.
orchestrator:
  id: grok-zen-master
  port: 4200
  provider: xai-grok
  model: grok-4
  requires_api_key: true
modules:
  - id: research
    name: Research Wing
    enabled: true
    description: Customize this list.
services:
  - unit: harbor-visualizer.service
    enabled: true
    wanted_by: graphical.target
experimentals:
  listed: true
  upload_allowed: true
  min_subscription: premium-plus
  risk: unsigned
