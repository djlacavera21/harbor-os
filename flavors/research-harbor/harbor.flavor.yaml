schema: harbor-flavor/v1
id: research-harbor
name: Research Harbor
version: 0.1.0
license: MIT
author:
  name: Harbor community template
  url: https://github.com/djlacavera21/harbor-os
summary: Research-wing default with offline source inbox and synthesis drafts.
description: |
  Community flavor aimed at long-form research. Publishing and design stay
  present but secondary. No required cloud accounts.
tags: [research, archives, community]
base:
  distro: linuxmint
  release: "22.3"
  desktop: cinnamon
  min_ram_mb: 4096
  arch: [x86_64]
identity:
  os_name: Harbor
  codename: Research
  pretty_name: Harbor OS Research 0.1
  hostname_prefix: harbor-rs
alignment:
  principles:
    - Research sovereignty
    - Source verification before synthesis
    - Offline-first notes
  operator_role: Emperor
  agent_role: Vizier
  offline_first: true
  telemetry: none
visualizer:
  id: zen-garden
  port: 8080
orchestrator:
  id: grok-zen-master
  port: 4200
  requires_api_key: true
modules:
  - id: research
    name: Research Wing
    enabled: true
  - id: archives
    name: Archives and Memory
    enabled: true
  - id: publishing
    name: Publishing Wing
    enabled: true
services:
  - unit: harbor-visualizer.service
    enabled: true
  - unit: harbor-zen-master.service
    enabled: false
experimentals:
  listed: true
  upload_allowed: true
  min_subscription: none
  risk: unsigned
