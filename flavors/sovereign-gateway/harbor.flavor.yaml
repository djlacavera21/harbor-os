schema: harbor-flavor/v1
id: sovereign-gateway
name: Sovereign Gateway Harbor
version: 0.1.0
license: MIT
author:
  name: FreshOS Development Collective
  url: https://github.com/djlacavera21/harbor-os
summary: Experimentals-first flavor. Independent download card, catalog contract, and Premium+ upload rehearsal for Harbor flavors.
description: |
  Community flavor that treats the Experimentals surface as a first-class wing.
  It does not claim official xAI or Grok App status. It ships the download card,
  the proposed Grok App information architecture, and local tools that print
  the independent links an Experimentals tab would consume.
tags:
  - community
  - experimentals
  - gateway
  - sovereign
base:
  distro: linuxmint
  release: "22.3"
  desktop: cinnamon
  min_ram_mb: 4096
  arch:
    - x86_64
identity:
  os_name: HarborOS
  codename: Sovereign Gateway
  pretty_name: Harbor OS Sovereign Gateway
  hostname_prefix: harbor
alignment:
  principles:
    - Sovereignty first — download works with no Grok App tab
    - Visual clarity over opacity
    - Honest affiliation — independent overlay, not an official OS
    - Graduated agency — Premium+ upload is proposed, not assumed
    - Long-term orientation — catalog and flavor format stay stable
  operator_role: Emperor
  agent_role: Vizier
  offline_first: true
  telemetry: none
visualizer:
  id: zen-garden
  port: 8080
  theme: raked-sand
  metaphor: "The garden is the station. The catalog is the gate. The zip is the harbor."
orchestrator:
  id: grok-zen-master
  port: 4200
  provider: xai-grok
  model: grok-4
  requires_api_key: true
modules:
  - id: gateway
    name: Experimentals Gateway
    enabled: true
    description: Independent download card and proposed Grok App Experimentals IA.
  - id: publishing
    name: Publishing Wing
    enabled: true
    description: Stage flavor packets for catalog review.
  - id: archives
    name: Archives and Memory
    enabled: true
    description: Keep the contract and session notes recoverable offline.
  - id: crew
    name: Crew Quarters
    enabled: true
    description: Operator standing orders for flavor authors.
services:
  - unit: harbor-visualizer.service
    enabled: true
    wanted_by: graphical.target
  - unit: harbor-zen-master.service
    enabled: false
    wanted_by: multi-user.target
experimentals:
  listed: true
  upload_allowed: true
  min_subscription: none
  risk: unsigned
