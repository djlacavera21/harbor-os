schema: harbor-flavor/v1
id: publishing-harbor
name: Publishing Harbor
version: 0.1.0
license: MIT
author:
  name: Harbor OS community
  url: https://github.com/djlacavera21/harbor-os
summary: Outbound-first flavor — draft staging, multi-platform notes, local archive.
description: |
  Community flavor that weights the Publishing Wing. Visualizer stays on.
  Orchestrator stays off until the operator supplies an API key.
  Intended as an unsigned Experimentals pack until reviewed.
tags:
  - publishing
  - archives
  - community
base:
  distro: linuxmint
  release: "22.3"
  desktop: cinnamon
  min_ram_mb: 4096
  arch:
    - x86_64
identity:
  os_name: Harbor
  codename: Publishing
  pretty_name: Harbor OS Publishing Harbor
  hostname_prefix: harbor-pub
alignment:
  principles:
    - Content sovereignty
    - Local archive before outbound
    - No required telemetry
  operator_role: Emperor
  agent_role: Vizier
  offline_first: true
  telemetry: none
visualizer:
  id: zen-garden
  port: 8080
  theme: raked-sand
orchestrator:
  id: grok-zen-master
  port: 4200
  provider: xai-grok
  requires_api_key: true
modules:
  - id: publishing
    name: Publishing Wing
    enabled: true
  - id: archives
    name: Archives
    enabled: true
  - id: design
    name: Design Wing
    enabled: true
  - id: research
    name: Research Wing
    enabled: true
services:
  - unit: harbor-visualizer.service
    enabled: true
  - unit: harbor-zen-master.service
    enabled: false
experimentals:
  listed: true
  upload_allowed: true
  min_subscription: premium-plus
  risk: unsigned
