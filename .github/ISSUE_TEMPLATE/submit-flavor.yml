name: Submit a Harbor flavor
description: Propose a community flavor for the Experimentals catalog
title: "flavor: "
labels: ["flavor", "experimentals"]
body:
  - type: markdown
    attributes:
      value: |
        Community uploads are reviewed here. A future Grok App Premium+ submenu would accept the same `harbor.flavor.yaml`.
        Do not attach ISO images or API keys.
  - type: input
    id: flavor_id
    attributes:
      label: Flavor id
      placeholder: my-harbor
    validations:
      required: true
  - type: textarea
    id: yaml
    attributes:
      label: harbor.flavor.yaml
      render: yaml
    validations:
      required: true
  - type: checkboxes
    id: attest
    attributes:
      label: Attestations
      options:
        - label: I validated with experimentals/validate_flavor.py
        - label: This pack contains no secrets, ISO images, or official-xAI branding
        - label: I understand listing is a pull request, not an automatic Grok App publish
      validations:
        required: true
